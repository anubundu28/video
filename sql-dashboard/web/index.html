<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>SQL Server Health Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="compat.js"></script>
  <script src="demo.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div id="unsupported" class="unsupported" hidden>
    <h1>Please open this dashboard in Microsoft Edge or Google Chrome</h1>
    <p>This browser is too old to run the dashboard. Copy the address from the dashboard console window into Edge or Chrome.</p>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" data-icon="logo"></span>
      <div class="brand-text">
        <span class="brand-name" id="app-title">SQL Server Health</span>
        <span class="env" id="env-badge" hidden></span>
      </div>
    </div>

    <div class="picker" id="picker">
      <button class="picker-btn" id="picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="picker-icon"><span data-icon="server"></span><span class="dot" id="picker-dot"></span></span>
        <span class="picker-text">
          <span class="picker-label">Server</span>
          <span class="picker-name" id="picker-name">Select a server</span>
        </span>
        <span data-icon="chevron" class="picker-chev"></span>
      </button>
      <div class="popover picker-pop" id="picker-pop" hidden>
        <div class="pop-search" id="picker-search-wrap">
          <span data-icon="search"></span>
          <input type="text" id="picker-filter" placeholder="Find a server" aria-label="Find a server" autocomplete="off">
        </div>
        <div class="picker-list" id="picker-list" role="listbox" aria-label="SQL Servers"></div>
      </div>
    </div>

    <div class="search" id="search">
      <span data-icon="search" class="search-icon"></span>
      <input type="text" id="search-input" placeholder="Search databases, pages or servers" aria-label="Search" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
      <div class="popover search-pop" id="search-pop" hidden role="listbox" aria-label="Search results"></div>
    </div>

    <div class="actions">
      <label class="auto" title="Refresh the current page automatically">
        <span data-icon="refresh"></span>
        <select id="auto-refresh" aria-label="Auto refresh">
          <option value="0">Manual</option>
          <option value="1">1 min</option>
          <option value="5">5 min</option>
          <option value="15">15 min</option>
        </select>
      </label>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light / dark theme" title="Switch light / dark theme">
        <span data-icon="sun" class="when-dark"></span><span data-icon="moon" class="when-light"></span>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Pages"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tip" id="tip" hidden></div>
</body>
</html>
